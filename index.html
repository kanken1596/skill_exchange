<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <!-- 頁首區塊 -->
    <header>
        <div class="container">
            <div class="logo">技能交換平台</div>
            <nav>
                <ul>
                    <li><a href="#">首頁</a></li>
                    <li><a href="#">尋找技能</a></li>
                    <li><a href="#">提供技能</a></li>
                    <li><a href="#">我的主頁</a></li>
                    <li><a href="#">登入/註冊</a></li>
                </ul>
            </nav>
            <div style="clear: both;"></div>  <!-- 清除浮動 -->
        </div>
    </header>

    <!-- 主要內容區塊 -->
    <main>
        <!-- 側邊欄區塊 -->
        <aside>
            <div class="container">
                <h2>熱門技能</h2>
                <ul>
                    <li><a href="#">程式設計</a></li>

                    <li><a href="#">烹飪技巧</a></li>
                    <li><a href="#">攝影技巧</a></li>
                </ul>
            </div>
        </aside>

        <!-- 文章內容區塊 -->
        <section>
            <h2>最新技能發布</h2>
            <div class="container">
                <div class="skill-post">
                    <h3>學習Python程式設計</h3>
                    <p>提供者：Alice</p>
                    <p>描述：我可以教你如何使用Python進行程式設計，從基礎到進階都可以。</p>
                    <button>聯繫提供者</button>
                </div>
                <hr>
                <div class="skill-post">
                    <h3>學習日語會話</h3>
                    <p>提供者：Bob</p>
                    <p>描述：我可以幫助你提升日語會話能力，適合初學者和中級學習者。</p>
                    <button>聯繫提供者</button>
                </div>
                <hr>
                <div class="skill-post">
                    <h3>學習烹飪技巧</h3>
                    <p>提供者：Charlie</p>
                    <p>描述：我可以教你一些簡單又美味的料理，適合家庭主婦和烹飪愛好者。</p>
                    <button>聯繫提供者</button>
                </div>
            </div>
        </section>
    </main>

    <!-- 頁尾區塊 -->
    <footer>
        <div class="container">
            <p>&copy; 2024 技能交換平台. 保留所有權利.</p>
        </div>
